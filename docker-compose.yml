services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: collab_notes
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432" # local development and tests; bound to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_notes"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      # Set a real secret:  JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (e.g. openssl rand -base64 48)}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/collab_notes
    restart: unless-stopped

volumes:
  pgdata:
